<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Holdout win rate by agent</title>
<desc id="desc">Win rate on twenty independent holdout maps.</desc>
<rect width="100%" height="100%" rx="18" fill="#f8fafc"/>
<text x="42" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Holdout win rate by agent</text>
<text x="42" y="73" font-family="Arial, sans-serif" font-size="14" fill="#475569">20 independent maps · training seeds 100–199 · holdout seeds 2000–2019</text>
<line x1="245.0" y1="90" x2="245.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="245.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">0%</text>
<line x1="364.0" y1="90" x2="364.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="364.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">20%</text>
<line x1="483.0" y1="90" x2="483.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="483.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">40%</text>
<line x1="602.0" y1="90" x2="602.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="602.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">60%</text>
<line x1="721.0" y1="90" x2="721.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="721.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">80%</text>
<line x1="840.0" y1="90" x2="840.0" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="840.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">100%</text>
<text x="225" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">A* Search (full visibility)</text>
<rect x="245" y="105" width="595" height="38" rx="7" fill="#e2e8f0"/>
<rect x="245" y="105" width="595.0" height="38" rx="7" fill="#2563eb"/>
<text x="830.0" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">100%</text>
<text x="225" y="192" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Rule-based</text>
<rect x="245" y="167" width="595" height="38" rx="7" fill="#e2e8f0"/>
<rect x="245" y="167" width="565.2" height="38" rx="7" fill="#0f766e"/>
<text x="800.2" y="192" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">95%</text>
<text x="225" y="254" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Greedy baseline</text>
<rect x="245" y="229" width="595" height="38" rx="7" fill="#e2e8f0"/>
<rect x="245" y="229" width="476.0" height="38" rx="7" fill="#d97706"/>
<text x="711.0" y="254" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">80%</text>
<text x="225" y="316" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Random Forest</text>
<rect x="245" y="291" width="595" height="38" rx="7" fill="#e2e8f0"/>
<rect x="245" y="291" width="416.5" height="38" rx="7" fill="#7c3aed"/>
<text x="651.5" y="316" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">70%</text>
<text x="225" y="378" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Random baseline</text>
<rect x="245" y="353" width="595" height="38" rx="7" fill="#e2e8f0"/>
<rect x="245" y="353" width="0.0" height="38" rx="7" fill="#64748b"/>
<text x="255.0" y="378" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">0%</text>
<text x="42" y="414" font-family="Arial, sans-serif" font-size="12" fill="#64748b">A* is an upper bound and is not information-equivalent to partial-observation agents.</text>
</svg>
